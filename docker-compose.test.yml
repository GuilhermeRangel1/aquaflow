services:
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      AQUAFLOW_TEST_DATABASE_URL: postgresql+asyncpg://aquaflow:${POSTGRES_PASSWORD:-aquaflow-local}@db:5432/aquaflow
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - test

  mqtt-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aquaflow_test
      POSTGRES_USER: aquaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquaflow-local}
    volumes:
      - aquaflow-postgres-mqtt-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaflow -d aquaflow_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["test"]

  mqtt-test-api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aquaflow:${POSTGRES_PASSWORD:-aquaflow-local}@mqtt-test-db:5432/aquaflow_test
      JWT_SECRET: local-only-mqtt-test-secret-with-enough-length
      DEMO_MODE: "true"
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-AquaFlow-demo-123!}
    command: >-
      sh -c "alembic upgrade head && python -m app.demo_seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      mqtt-test-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["test"]

  mqtt-test-broker:
    build:
      context: ./infrastructure/mqtt
    environment:
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:-aquaflow-local-publisher}
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:-aquaflow-local-ingestor}
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_pub -h localhost -u aquaflow-publisher -P "$$MQTT_PUBLISH_PASSWORD" -t aquaflow/health -n
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["test"]

  mqtt-test-ingestor:
    build:
      context: ./backend
    command: python -m app.mqtt_ingestor
    environment:
      MQTT_HOST: mqtt-test-broker
      MQTT_INGEST_USER: aquaflow-ingestor
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:-aquaflow-local-ingestor}
      AQUAFLOW_API_URL: http://mqtt-test-api:8000
    depends_on:
      mqtt-test-api:
        condition: service_healthy
      mqtt-test-broker:
        condition: service_healthy
    profiles: ["test"]

  mqtt-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    command: python -m pytest -q tests/test_mqtt_compose_flow.py
    environment:
      AQUAFLOW_MQTT_E2E: "1"
      AQUAFLOW_API_URL: http://mqtt-test-api:8000
      MQTT_HOST: mqtt-test-broker
      MQTT_PUBLISH_USER: aquaflow-publisher
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:-aquaflow-local-publisher}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-AquaFlow-demo-123!}
    depends_on:
      mqtt-test-api:
        condition: service_healthy
      mqtt-test-broker:
        condition: service_healthy
      mqtt-test-ingestor:
        condition: service_started
    profiles:
      - test

  ml-test-inference:
    build:
      context: ./ml
      dockerfile: Dockerfile.training
    command: python inference_worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://aquaflow:${POSTGRES_PASSWORD:-aquaflow-local}@mqtt-test-db:5432/aquaflow_test
      ML_MODEL_PATH: /app/data/ml/training/best_model.joblib
      ML_TRAINING_REPORT_PATH: /app/data/ml/training/metrics.json
      ML_POLL_SECONDS: "2"
    volumes:
      - ./data/ml:/app/data/ml:ro
    depends_on:
      mqtt-test-api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["ml-test"]

  mqtt-ml-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    command: python -m pytest -q tests/test_mqtt_compose_flow.py -k actionable_alerts
    environment:
      AQUAFLOW_ML_MQTT_E2E: "1"
      AQUAFLOW_API_URL: http://mqtt-test-api:8000
      MQTT_HOST: mqtt-test-broker
      MQTT_PUBLISH_USER: aquaflow-publisher
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:-aquaflow-local-publisher}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-AquaFlow-demo-123!}
    depends_on:
      mqtt-test-api:
        condition: service_healthy
      mqtt-test-broker:
        condition: service_healthy
      mqtt-test-ingestor:
        condition: service_started
      ml-test-inference:
        condition: service_started
    profiles: ["ml-test"]

volumes:
  aquaflow-postgres-mqtt-test:
