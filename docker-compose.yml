services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aquaflow
      POSTGRES_USER: aquaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquaflow-local}
    ports:
      - "5432:5432"
    volumes:
      - aquaflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaflow -d aquaflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aquaflow:${POSTGRES_PASSWORD:-aquaflow-local}@db:5432/aquaflow
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deploy}
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-AquaFlow-demo-123!}
      MQTT_INGESTOR_HEALTH_URL: http://mqtt-ingestor:8081/health
      ML_WORKER_HEALTH_URL: http://ml-inference:8081/health
    command: >-
      sh -c "alembic upgrade head && python -m app.demo_seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  mqtt:
    build:
      context: ./infrastructure/mqtt
    environment:
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:-aquaflow-local-publisher}
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:-aquaflow-local-ingestor}
    volumes:
      - aquaflow-mqtt:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_pub -h localhost -u aquaflow-publisher -P "$$MQTT_PUBLISH_PASSWORD" -t aquaflow/health -n
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mqtt-ingestor:
    build:
      context: ./backend
    command: python -m app.mqtt_ingestor
    environment:
      MQTT_HOST: mqtt
      MQTT_INGEST_USER: aquaflow-ingestor
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:-aquaflow-local-ingestor}
      AQUAFLOW_API_URL: http://api:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8081/health', timeout=3)); raise SystemExit(0 if d['status']=='connected' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mqtt:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  mqtt-publisher:
    profiles: ["tools"]
    build:
      context: ./backend
    command: python -m app.mqtt_publish
    environment:
      MQTT_HOST: mqtt
      MQTT_PUBLISH_USER: aquaflow-publisher
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:-aquaflow-local-publisher}
    depends_on:
      mqtt:
        condition: service_healthy

  ml-data-generator:
    profiles: ["tools"]
    build:
      context: ./ml
    volumes:
      - ./data:/app/data

  mlflow:
    build:
      context: ./ml
      dockerfile: Dockerfile.training
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data/ml/mlflow-server:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ml-trainer:
    build:
      context: ./ml
      dockerfile: Dockerfile.training
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_RETRAIN_MODEL: ${ML_RETRAIN_MODEL:-false}
    command:
      - sh
      - -c
      - >-
        if [ "$$ML_RETRAIN_MODEL" != "true" ] &&
        [ -s /app/data/ml/training/best_model.joblib ] &&
        [ -s /app/data/ml/training/metrics.json ]; then
          echo "Modelo existente encontrado; treinamento automático ignorado. Defina ML_RETRAIN_MODEL=true para treinar novamente.";
        else
          python generate_mock_data.py --output data/ml/compose/raw/mock_readings.csv --seed 42 --start 2026-09-01T00:00:00-03:00 --timezone America/Sao_Paulo --days 16 --interval-minutes 5 &&
          python prepare_dataset.py analyze --input data/ml/compose/raw/mock_readings.csv --output-dir data/ml/compose/analysis --timezone America/Sao_Paulo &&
          python prepare_dataset.py prepare --input data/ml/compose/raw/mock_readings.csv --output-dir data/ml/compose/prepared --timezone America/Sao_Paulo &&
          python train_model.py --features data/ml/compose/prepared/features.csv --labels data/ml/compose/prepared/labels.csv --metadata data/ml/compose/prepared/metadata.csv --output-dir data/ml/training --timezone America/Sao_Paulo;
        fi
    volumes:
      - ./data/ml:/app/data/ml
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  ml-inference:
    build:
      context: ./ml
      dockerfile: Dockerfile.training
    command: python inference_worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://aquaflow:${POSTGRES_PASSWORD:-aquaflow-local}@db:5432/aquaflow
      ML_MODEL_PATH: /app/data/ml/training/best_model.joblib
      ML_TRAINING_REPORT_PATH: /app/data/ml/training/metrics.json
      ML_POLL_SECONDS: ${ML_POLL_SECONDS:-5}
      ML_HEALTH_PORT: 8081
    volumes:
      - ./data/ml:/app/data/ml:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      ml-trainer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8081/health', timeout=3)); raise SystemExit(0 if d['status']=='healthy' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ml-airflow:
    image: apache/airflow:3.3.2-python3.12
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      # Local-only convenience: the UI is bound to localhost below.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - aquaflow-airflow:/opt/airflow
      - ./ml/airflow/dags:/opt/airflow/dags:ro
      - ./ml:/opt/airflow/ml:ro
      - ./data/ml:/opt/airflow/data/ml
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  frontend:
    build:
      context: ./frontend
    environment:
      AQUAFLOW_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  aquaflow-postgres:
  aquaflow-mqtt:
  aquaflow-airflow:
