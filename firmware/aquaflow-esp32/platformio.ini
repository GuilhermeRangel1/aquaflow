; AquaFlow - firmware do medidor ESP32-WROOM-32
; https://docs.platformio.org/en/latest/projectconf/index.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -D AQUAFLOW_FIRMWARE_VERSION='"0.1.0"'
