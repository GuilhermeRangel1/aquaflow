; AquaFlow - firmware do medidor ESP32-WROOM-32
; https://docs.platformio.org/en/latest/projectconf/index.html

[env:esp32dev]
; Arduino como COMPONENTE do ESP-IDF (framework = arduino, espidf). Necessario porque o
; transporte MQTT v5 usa a user property "device-key" (API esp_mqtt5_*), e a libmqtt
; pre-compilada do core Arduino e montada SEM MQTT 5 (CONFIG_MQTT_PROTOCOL_5 desligado).
; Neste modo o esp-mqtt e recompilado do fonte honrando o sdkconfig.defaults, que habilita
; o MQTT 5 e inclui mqtt5_client.c. Mantem todo o codigo Arduino (WiFi, Serial, ArduinoJson).
; Plataforma 8.x => Arduino 3.3.x / ESP-IDF 5.x (onde a API MQTT v5 existe).
platform = espressif32 @ ^8.0.0
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
; Particao customizada de app grande (factory ~3 MB, sem OTA). O binario com MQTT 5
; (~1,07 MB) nao cabe na particao padrao de 1 MB. board_build.partitions e tambem o que
; o checkprogsize do PlatformIO consulta para o limite de tamanho (o flag de sdkconfig
; sozinho nao cobre essa verificacao). Ver partitions.csv.
board_build.partitions = partitions.csv
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -D AQUAFLOW_FIRMWARE_VERSION='"0.1.0"'
